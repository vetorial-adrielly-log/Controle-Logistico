<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#284D38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rastreamento Logístico</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23284D38' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='1' y='7' width='15' height='10' rx='1'/%3E%3Cpath d='M16 10h3.5L22 13.5V17h-6'/%3E%3Ccircle cx='5.5' cy='18.5' r='1.8'/%3E%3Ccircle cx='17.5' cy='18.5' r='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen" hidden>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark" data-icon="truck"></div>
      <div>
        <div class="login-brand-text">Rastreamento Logístico</div>
        <div class="login-brand-sub">Transportadoras · Motoristas · Entregas</div>
      </div>
    </div>
    <h1>Entrar</h1>
    <p class="lead">Contratante e transportadoras entram com o e-mail. Motoristas entram com o CPF (ou documento).</p>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-user">E-mail, CPF ou documento</label>
        <input type="text" id="login-user" placeholder="email@empresa.com ou 000.000.000-00" autocomplete="username" autocapitalize="off" required>
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <div class="login-hint">
      Não tem acesso? Motoristas: peça à sua transportadora. Transportadoras: peça ao contratante.
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-mark" data-icon="truck"></span>
      <div>
        <div class="topbar-title">Rastreamento Logístico</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
    </div>
    <nav class="topnav" id="topnav"></nav>
    <div class="topbar-user">
      <div class="user-chip" id="user-chip"></div>
      <button class="icon-btn" id="logout-btn" title="Sair" aria-label="Sair" data-icon="logout"></button>
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal-body" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status"><span id="toast-text"></span></div>

<script src="app.js"></script>
</body>
</html>
