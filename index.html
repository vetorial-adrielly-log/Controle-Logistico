<style>
  :root{
    --black:#131313;
    --green-dark:#284D38;
    --blue-dark:#28437E;
    --green-mid:#2B712B;
    --green-light:#40976F;
    --orange:#CC8F2D;

    --bg-cream:#F7F5F0;
    --card:#FFFFFF;
    --border:#E9E4D9;
    --text-primary:var(--black);
    --text-secondary:#6E6A5F;
    --text-inverse:#F3F1EA;
    --text-inverse-dim:#B9C9BE;
    --danger:#B3402F;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg-cream);
    color:var(--text-primary);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{font-family:'Poppins',system-ui,sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 12% 15%, rgba(64,151,111,0.30), transparent 42%),
      radial-gradient(circle at 88% 85%, rgba(40,67,126,0.28), transparent 42%),
      var(--green-dark);
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:#20402F;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:40px 36px 32px;
    box-shadow:0 24px 70px rgba(0,0,0,0.4);
  }
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .login-logo-img{height:46px;width:auto;display:block;}
  .login-brand-mark{
    width:42px;height:42px;border-radius:50%;
    background:#F3F1EA;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .login-brand-mark svg{width:22px;height:22px;}
  .login-brand-text{font-family:'Poppins';color:var(--text-inverse);font-weight:700;font-size:15.5px;letter-spacing:0.2px;}
  .login-brand-sub{color:var(--text-inverse-dim);font-size:11.5px;margin-top:1px;}
  .login-card h1{color:var(--text-inverse);font-size:23px;font-weight:700;margin:0 0 6px;}
  .login-card p.lead{color:var(--text-inverse-dim);font-size:13.5px;margin:0 0 26px;line-height:1.55;}
  .field{margin-bottom:16px;}
  .field label{display:block;color:var(--text-inverse-dim);font-size:12.5px;font-weight:600;margin-bottom:7px;}
  .field input{
    width:100%;padding:11px 13px;border-radius:9px;
    border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.06);
    color:var(--text-inverse);font-size:14px;outline:none;
    transition:border-color .15s, background .15s;
  }
  .field input:focus{border-color:var(--green-light);background:rgba(255,255,255,0.1);}
  .field input::placeholder{color:#6D8477;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:600;
    transition:transform .1s, filter .15s, background .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--green-mid);color:#fff;width:100%;margin-top:6px;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
  .btn-ghost:hover{background:#F1EEE5;}
  .btn-danger{background:#F7E7E3;color:var(--danger);}
  .btn-danger:hover{background:#F1D9D2;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .login-error{
    background:rgba(179,64,47,0.18);border:1px solid rgba(179,64,47,0.35);color:#F3AFA0;
    font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:16px;display:none;
  }
  .login-hint{
    margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.1);
    color:var(--text-inverse-dim);font-size:11.5px;line-height:1.6;
  }
  .login-hint code{background:rgba(255,255,255,0.12);padding:1px 5px;border-radius:4px;color:var(--text-inverse);}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  #app.active{display:flex;}

  .sidebar{
    width:104px;flex-shrink:0;background:var(--green-dark);
    display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
  }
  .sidebar-brand{
    display:flex;align-items:center;justify-content:center;
    padding:20px 10px 16px;
  }
  .sidebar-brand-mark{
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .sidebar-brand-mark img{height:46px;width:auto;object-fit:contain;display:block;}

  .sidebar-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 8px;}
  .nav-section-label{
    color:var(--text-inverse-dim);opacity:0.6;font-size:9px;font-weight:700;
    letter-spacing:0.06em;text-align:center;padding:14px 4px 6px;text-transform:uppercase;
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:10px 4px;border-radius:16px;border:none;background:none;width:100%;
    margin-bottom:4px;cursor:pointer;transition:background .15s;
  }
  .nav-item .icon-badge{
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,0.1);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .15s;
  }
  .nav-item .icon-badge svg{width:18px;height:18px;color:#fff;opacity:0.92;}
  .nav-item .nav-label{
    font-family:'Poppins';color:var(--text-inverse-dim);font-size:9.5px;font-weight:600;
    text-align:center;line-height:1.25;max-width:88px;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .nav-item.active{background:var(--green-light);}
  .nav-item.active .icon-badge{background:rgba(255,255,255,0.22);}
  .nav-item.active .nav-label{color:#fff;}
  .nav-empty{color:var(--text-inverse-dim);opacity:0.7;font-size:10.5px;padding:8px 10px;line-height:1.5;text-align:center;}

  .sidebar-footer{padding:12px 10px 16px;border-top:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;align-items:center;gap:10px;}
  .user-avatar{
    width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.12);
    color:var(--text-inverse);display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex-shrink:0;font-family:'Poppins';
  }
  .user-meta-name{color:var(--text-inverse);font-size:10.5px;font-weight:600;text-align:center;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-meta-role{color:var(--text-inverse-dim);font-size:9px;text-align:center;}
  .logout-btn{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.08);color:var(--text-inverse-dim);border:none;
    transition:background .12s,color .12s;
  }
  .logout-btn:hover{background:rgba(179,64,47,0.35);color:#F3AFA0;}
  .logout-btn svg{width:15px;height:15px;}

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
  .topbar{
    display:flex;align-items:center;
    padding:22px 32px 18px;background:var(--bg-cream);
  }
  .topbar-logo-img{height:32px;width:auto;object-fit:contain;margin-right:14px;flex-shrink:0;align-self:center;}
  .topbar-sub{font-family:'Poppins';font-size:14.5px;font-weight:600;color:var(--black);margin-top:6px;line-height:1.4;max-width:520px;}
  .topbar-sub:empty{display:none;}

  .content{padding:6px 32px 48px;flex:1;}

  .panel-frame-wrap{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;height:calc(100vh - 168px);min-height:420px;
    display:flex;flex-direction:column;
  }
  .panel-frame-head{
    padding:13px 20px;border-bottom:1px solid var(--border);
    font-family:'Poppins';font-size:11px;font-weight:700;letter-spacing:0.05em;
    text-transform:uppercase;color:var(--black);text-align:center;
  }
  .panel-frame-wrap iframe{border:none;width:100%;height:100%;flex:1;}
  .panel-placeholder{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--text-secondary);text-align:center;padding:40px;
  }
  .panel-placeholder svg{width:40px;height:40px;opacity:0.3;color:var(--green-mid);}
  .panel-placeholder b{color:var(--text-primary);font-size:14px;font-family:'Poppins';}
  .panel-placeholder span{font-size:12.5px;max-width:360px;line-height:1.6;}

  .empty-state{
    background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);
    padding:60px 30px;text-align:center;color:var(--text-secondary);
  }
  .empty-state svg{width:38px;height:38px;opacity:0.35;margin-bottom:12px;color:var(--green-mid);}
  .empty-state h3{font-size:15px;margin:0 0 6px;}
  .empty-state p{font-size:13px;margin:0 auto;max-width:380px;line-height:1.6;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
  .card + .card{margin-top:18px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .card-head h2{font-size:15px;margin:0;}
  .card-head p{font-size:12.5px;color:var(--text-secondary);margin:2px 0 0;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--border);}
  td{padding:12px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;background:#E7EEF7;color:var(--blue-dark);}
  .tag.admin{background:#F7EEDC;color:var(--orange);}
  .tag-panel{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:500;background:#EEF4F0;color:var(--green-mid);margin:2px 3px 2px 0;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
  .icon-btn:hover{background:#F1EEE5;color:var(--text-primary);}
  .icon-btn svg{width:14px;height:14px;}
  .icon-btn.danger:hover{background:#F7E7E3;color:var(--danger);}

  /* ---------- MODAL ---------- */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(19,19,19,0.55);align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay.active{display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,0.3);}
  .modal h3{margin:0 0 4px;font-size:17px;}
  .modal p.modal-sub{margin:0 0 22px;color:var(--text-secondary);font-size:12.5px;}
  .field-light label{display:block;font-size:12.5px;font-weight:600;color:var(--text-primary);margin-bottom:6px;}
  .field-light input, .field-light select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);font-size:13.5px;outline:none;background:#FBFAF6;}
  .field-light input:focus, .field-light select:focus{border-color:var(--green-light);background:#fff;}
  .field-light{margin-bottom:15px;}
  .checkbox-grid{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#FBFAF6;}
  .checkbox-row{display:flex;align-items:center;gap:9px;padding:6px 2px;font-size:13px;}
  .checkbox-row input{width:15px;height:15px;accent-color:var(--green-mid);}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions .btn{flex:1;}
  .form-error{background:#F7E7E3;color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;}

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--green-dark);color:#fff;
    padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);z-index:100;display:flex;align-items:center;gap:9px;
    opacity:0;transform:translateY(8px);transition:opacity .2s, transform .2s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast svg{width:15px;height:15px;color:var(--green-light);flex-shrink:0;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#DDD7C8;border-radius:10px;}
  .sidebar ::-webkit-scrollbar-thumb{background:#1E3A2A;}

  @media (max-width: 860px){
    .sidebar{position:fixed;left:-120px;z-index:40;transition:left .2s;}
    .sidebar.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,0.4);}
    .topbar{padding:16px 18px;flex-direction:column;gap:14px;}
    .content{padding:12px 18px 32px;}
    .menu-toggle{display:flex !important;}
  }
  .menu-toggle{display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#fff;align-items:center;justify-content:center;margin-right:10px;flex-shrink:0;}
</style>
</head>

<script>
(function(){
  "use strict";

  /* ============================================================
     SUPABASE CONFIG — preencha com os dados do seu projeto
     (Configurações > API no painel do Supabase)
     ============================================================ */
  const SUPABASE_URL = "https://kqrpjjyyzojtpknwelxc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1QM8Tnw7rOJLzvtJ4VaTKw_UNe2uJCr";

  const CONFIG_MISSING = SUPABASE_URL.includes("SEU-PROJETO") || SUPABASE_ANON_KEY.includes("SUA-CHAVE");

  let sb = null;
  if (!CONFIG_MISSING) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  /* ============================================================
     ICONS
     ============================================================ */
  const ICONS = {
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    truck: '<rect x="1" y="7" width="15" height="10" rx="1"/><path d="M16 10h3.5L22 13.5V17h-6"/><circle cx="5.5" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/>',
    package: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>',
    box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>',
    chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
    helmet: '<path d="M4 15a8 8 0 0 1 16 0"/><path d="M4 15h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M12 4v3"/><path d="M2 15h2M20 15h2"/>',
    gem: '<path d="m6 3 12 0 4 6-10 12L2 9Z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/>',
    bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    flame: '<path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-1.5.8-2.6 1.5-3.5.3.9 1 1.5 1.8 1.5.9 0 1.7-.7 1.7-1.7 0-1-.7-1.8-.7-3.3C11.3 3.5 12 2 12 2Z"/>',
    edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z"/>',
    trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'
  };
  function icon(name, cls){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls||''}">${ICONS[name]||ICONS.grid}</svg>`; }

  /* ============================================================
     STATE
     ============================================================ */
  let currentProfile = null; // { id, email, username, role, allowed_panels }
  let panelsCache = [];
  let activeView = null;

  /* ============================================================
     TOAST
     ============================================================ */
  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById("toast");
    document.getElementById("toast-text").textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove("show"), 2800);
  }

  /* ============================================================
     CONFIG-MISSING BANNER
     ============================================================ */
  function showConfigMissing(){
    document.getElementById("login-screen").style.display = "flex";
    const card = document.querySelector(".login-card");
    card.innerHTML = `
      <h1>Configuração pendente</h1>
      <p class="lead">Este portal ainda não está conectado ao Supabase. Abra o arquivo <code style="background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px;">index.html</code>, localize <code style="background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px;">SUPABASE_URL</code> e <code style="background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px;">SUPABASE_ANON_KEY</code> perto do topo do script, e cole os valores do seu projeto (Configurações → API no painel do Supabase). Veja o <code style="background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px;">README.md</code> para o passo a passo completo.</p>`;
  }

  /* ============================================================
     LOGIN
     ============================================================ */
  const loginForm = document.getElementById("login-form");
  const loginError = document.getElementById("login-error");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    loginError.style.display = "none";

    const submitBtn = loginForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "Entrando...";

    const { error } = await sb.auth.signInWithPassword({ email, password });

    submitBtn.disabled = false;
    submitBtn.textContent = "Entrar";

    if (error) {
      showLoginError(error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : error.message);
      return;
    }
    await loadProfileAndEnter();
  });
  function showLoginError(msg){ loginError.textContent = msg; loginError.style.display = "block"; }

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await sb.auth.signOut();
    location.reload();
  });

  /* ============================================================
     LOAD PROFILE + PANELS, ENTER APP
     ============================================================ */
  async function loadProfileAndEnter(){
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { document.getElementById("login-screen").style.display = "flex"; return; }

    const { data: profile, error: profErr } = await sb
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .single();

    if (profErr || !profile) {
      showLoginError("Seu usuário não tem um perfil configurado. Peça a um administrador para cadastrá-lo.");
      await sb.auth.signOut();
      return;
    }
    currentProfile = profile;

    const { data: panels, error: panelsErr } = await sb
      .from("panels")
      .select("*")
      .order("created_at", { ascending: true });
    panelsCache = panels || [];

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").classList.add("active");

    document.getElementById("user-avatar").textContent = (profile.username || profile.email).slice(0,2).toUpperCase();
    document.getElementById("user-avatar").title = `${profile.username || profile.email} · ${profile.role === "admin" ? "Administrador" : "Usuário"}`;
    document.getElementById("nav-admin-section").style.display = profile.role === "admin" ? "block" : "none";

    renderSidebarPanels();
    bindAdminNav();

    const allowed = getAllowedPanels();
    if (allowed.length) {
      setActiveView("panel:" + allowed[0].id);
    } else if (profile.role === "admin") {
      setActiveView("admin-users");
    } else {
      setActiveView("none");
    }
  }

  function getAllowedPanels(){
    if (!currentProfile) return [];
    if (currentProfile.role === "admin") return panelsCache;
    const allowedIds = currentProfile.allowed_panels || [];
    return panelsCache.filter(p => allowedIds.includes(p.id));
  }

  /* ============================================================
     NAVIGATION / VIEWS
     ============================================================ */
  function renderSidebarPanels(){
    const wrap = document.getElementById("nav-panels");
    const allowed = getAllowedPanels();
    if (!allowed.length){
      wrap.innerHTML = `<div class="nav-empty">Nenhum painel liberado ainda. Fale com o administrador.</div>`;
      return;
    }
    wrap.innerHTML = allowed.map(p => `
      <button class="nav-item" data-view="panel:${p.id}">
        <span class="icon-badge">${icon(p.icon || "grid")}</span>
        <span class="nav-label">${escapeHtml(p.name)}</span>
      </button>
    `).join("");
    wrap.querySelectorAll(".nav-item").forEach(btn=>{
      btn.addEventListener("click", () => setActiveView(btn.dataset.view));
    });
  }

  function bindAdminNav(){
    document.querySelectorAll('#nav-admin-section .nav-item').forEach(btn=>{
      btn.addEventListener("click", () => setActiveView(btn.dataset.view));
    });
  }

  function setActiveView(view){
    activeView = view;
    document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.view === view));
    document.getElementById("sidebar").classList.remove("open");

    if (view.startsWith("panel:")) {
      renderPanelView(view.split(":")[1]);
    } else if (view === "admin-users") {
      renderAdminUsers();
    } else if (view === "admin-panels") {
      renderAdminPanels();
    } else {
      renderNoAccess();
    }
  }

  function setTopbar(sub){
    document.getElementById("topbar-sub").textContent = sub || "";
  }

  function renderNoAccess(){
    setTopbar("");
    document.getElementById("content").innerHTML = `
      <div class="empty-state">
        ${icon("grid")}
        <h3>Nenhum painel disponível</h3>
        <p>Seu usuário ainda não tem painéis liberados. Peça a um administrador para configurar o acesso em "Admin → Usuários".</p>
      </div>`;
  }

  function renderPanelView(panelId){
    const panel = panelsCache.find(p => p.id === panelId);
    if (!panel) { renderNoAccess(); return; }
    setTopbar(panel.description || "");
    const content = document.getElementById("content");
    if (panel.embed_url) {
      content.innerHTML = `
        <div class="panel-frame-wrap">
          <div class="panel-frame-head">${escapeHtml(panel.name)}</div>
          <iframe src="${escapeAttr(panel.embed_url)}" allowfullscreen title="${escapeAttr(panel.name)}"></iframe>
        </div>`;
    } else {
      content.innerHTML = `
        <div class="panel-frame-wrap">
          <div class="panel-frame-head">${escapeHtml(panel.name)}</div>
          <div class="panel-placeholder">
            ${icon("external")}
            <b>Link de incorporação não configurado</b>
            <span>Este painel ainda não tem uma URL de embed do Power BI. Um administrador pode configurá-la em "Admin → Painéis".</span>
          </div>
        </div>`;
    }
  }

  /* ============================================================
     ADMIN — USERS  (profiles table + Netlify Functions for
     creating/deleting real auth accounts)
     ============================================================ */
  async function renderAdminUsers(){
    setTopbar("Usuários — cadastre usuários e escolha quais painéis cada um pode ver");
    const content = document.getElementById("content");
    content.innerHTML = `<div class="card"><p style="color:var(--text-secondary);font-size:13px;">Carregando usuários...</p></div>`;

    const { data: users, error } = await sb.from("profiles").select("*").order("created_at", { ascending: true });
    if (error) {
      content.innerHTML = `<div class="card"><p style="color:var(--danger);font-size:13px;">Erro ao carregar usuários: ${escapeHtml(error.message)}</p></div>`;
      return;
    }

    content.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div>
            <h2>Usuários cadastrados</h2>
            <p>${users.length} usuário(s)</p>
          </div>
          <button class="btn btn-primary btn-sm" id="btn-new-user" style="width:auto;">${icon("plus")} Novo usuário</button>
        </div>
        <table>
          <thead><tr><th>Usuário</th><th>E-mail</th><th>Perfil</th><th>Painéis liberados</th><th></th></tr></thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    `;
    const tbody = document.getElementById("users-tbody");
    tbody.innerHTML = users.map(u => {
      const allowedIds = u.allowed_panels || [];
      const panelTags = u.role === "admin"
        ? `<span class="tag-panel">Todos (admin)</span>`
        : (panelsCache.filter(p => allowedIds.includes(p.id)).map(p => `<span class="tag-panel">${escapeHtml(p.name)}</span>`).join("") || `<span class="tag-panel">Nenhum</span>`);
      return `
        <tr>
          <td><strong>${escapeHtml(u.username || "—")}</strong></td>
          <td>${escapeHtml(u.email)}</td>
          <td><span class="tag ${u.role === 'admin' ? 'admin':''}">${u.role === 'admin' ? 'Administrador':'Usuário'}</span></td>
          <td>${panelTags}</td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" data-edit="${u.id}" title="Editar">${icon("edit")}</button>
              <button class="icon-btn danger" data-delete="${u.id}" title="Excluir">${icon("trash")}</button>
            </div>
          </td>
        </tr>`;
    }).join("");

    document.getElementById("btn-new-user").addEventListener("click", () => openUserModal(null, users));
    tbody.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openUserModal(b.dataset.edit, users)));
    tbody.querySelectorAll("[data-delete]").forEach(b => b.addEventListener("click", () => deleteUser(b.dataset.delete, users)));
  }

  function openUserModal(userId, users){
    const editing = !!userId;
    const user = editing ? users.find(u => u.id === userId) : null;

    const panelCheckboxes = panelsCache.map(p => `
      <label class="checkbox-row">
        <input type="checkbox" value="${p.id}" ${user && (user.allowed_panels||[]).includes(p.id) ? "checked":""}>
        ${escapeHtml(p.name)}
      </label>
    `).join("");

    openModal(`
      <h3>${editing ? "Editar usuário" : "Novo usuário"}</h3>
      <p class="modal-sub">${editing ? "Atualize o nome, o perfil e o acesso aos painéis." : "O usuário recebe uma senha temporária — recomende que ele a troque no primeiro acesso, ou use \"Enviar redefinição de senha\" depois de criado."}</p>
      <div class="form-error" id="user-form-error"></div>
      <form id="user-form">
        <div class="field-light">
          <label>Nome de exibição</label>
          <input type="text" id="uf-username" value="${editing ? escapeAttr(user.username||'') : ''}" placeholder="ex: João Silva" required>
        </div>
        <div class="field-light">
          <label>E-mail</label>
          <input type="email" id="uf-email" value="${editing ? escapeAttr(user.email) : ''}" placeholder="joao.silva@empresa.com" ${editing ? "disabled" : "required"}>
        </div>
        ${editing ? "" : `
        <div class="field-light">
          <label>Senha temporária</label>
          <input type="password" id="uf-password" placeholder="mínimo 6 caracteres" minlength="6" required>
        </div>`}
        <div class="field-light">
          <label>Perfil</label>
          <select id="uf-role">
            <option value="user" ${user && user.role==="user" ? "selected":""}>Usuário</option>
            <option value="admin" ${user && user.role==="admin" ? "selected":""}>Administrador</option>
          </select>
        </div>
        <div class="field-light" id="uf-panels-wrap">
          <label>Painéis liberados</label>
          <div class="checkbox-grid" id="uf-panels">${panelCheckboxes || '<div class="nav-empty" style="padding:6px 2px;">Nenhum painel cadastrado ainda.</div>'}</div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="uf-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">${editing ? "Salvar" : "Cadastrar"}</button>
        </div>
        ${editing ? `<button type="button" class="btn btn-ghost" id="uf-reset-pwd" style="width:100%;margin-top:10px;">Enviar redefinição de senha por e-mail</button>` : ""}
      </form>
    `);

    function toggleAdminHidesPanels(){
      const isAdmin = document.getElementById("uf-role").value === "admin";
      document.getElementById("uf-panels-wrap").style.opacity = isAdmin ? "0.45" : "1";
      document.getElementById("uf-panels-wrap").style.pointerEvents = isAdmin ? "none" : "auto";
    }
    document.getElementById("uf-role").addEventListener("change", toggleAdminHidesPanels);
    toggleAdminHidesPanels();

    document.getElementById("uf-cancel").addEventListener("click", closeModal);

    if (editing) {
      document.getElementById("uf-reset-pwd").addEventListener("click", async () => {
        const { error } = await sb.auth.resetPasswordForEmail(user.email);
        if (error) { toast("Erro ao enviar e-mail: " + error.message); }
        else { toast("E-mail de redefinição enviado para " + user.email); }
      });
    }

    document.getElementById("user-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("uf-username").value.trim();
      const role = document.getElementById("uf-role").value;
      const allowedPanels = Array.from(document.querySelectorAll("#uf-panels input:checked")).map(i => i.value);
      const errEl = document.getElementById("user-form-error");
      errEl.style.display = "none";

      if (!username) return showFormError(errEl, "Informe um nome de exibição.");

      const submitBtn = e.target.querySelector("button[type=submit]");
      submitBtn.disabled = true;

      if (editing) {
        const { error } = await sb.from("profiles").update({
          username,
          role,
          allowed_panels: role === "admin" ? [] : allowedPanels
        }).eq("id", userId);
        submitBtn.disabled = false;
        if (error) return showFormError(errEl, error.message);
        closeModal();
        renderAdminUsers();
        toast("Usuário atualizado.");
      } else {
        const email = document.getElementById("uf-email").value.trim();
        const password = document.getElementById("uf-password").value;
        if (!email || !password) { submitBtn.disabled = false; return showFormError(errEl, "Preencha e-mail e senha."); }

        try {
          const { data: { session } } = await sb.auth.getSession();
          const resp = await fetch("/.netlify/functions/admin-create-user", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + session.access_token
            },
            body: JSON.stringify({ email, password, username, role, allowedPanels })
          });
          const result = await resp.json();
          submitBtn.disabled = false;
          if (!resp.ok) return showFormError(errEl, result.error || "Não foi possível criar o usuário.");
          closeModal();
          renderAdminUsers();
          toast("Usuário cadastrado.");
        } catch (err) {
          submitBtn.disabled = false;
          showFormError(errEl, "Erro de rede ao chamar a função de criação de usuário. Ela está publicada no Netlify?");
        }
      }
    });
  }

  async function deleteUser(userId, users){
    const user = users.find(u => u.id === userId);
    if (!user) return;
    if (user.id === currentProfile.id) { toast("Você não pode excluir o próprio usuário logado."); return; }
    if (user.role === "admin" && users.filter(u=>u.role==="admin").length <= 1) {
      toast("É necessário manter ao menos um administrador.");
      return;
    }
    if (!confirm(`Excluir o usuário "${user.username || user.email}"? Essa ação não pode ser desfeita.`)) return;

    try {
      const { data: { session } } = await sb.auth.getSession();
      const resp = await fetch("/.netlify/functions/admin-delete-user", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({ userId })
      });
      const result = await resp.json();
      if (!resp.ok) { toast(result.error || "Não foi possível excluir o usuário."); return; }
      renderAdminUsers();
      toast("Usuário excluído.");
    } catch (err) {
      toast("Erro de rede ao chamar a função de exclusão de usuário.");
    }
  }

  /* ============================================================
     ADMIN — PANELS (direct table CRUD, protected by RLS)
     ============================================================ */
  async function renderAdminPanels(){
    setTopbar("Painéis — cadastre os painéis e cole a URL de incorporação do Power BI");
    const content = document.getElementById("content");
    content.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div>
            <h2>Painéis disponíveis</h2>
            <p>${panelsCache.length} painel(is) cadastrado(s)</p>
          </div>
          <button class="btn btn-primary btn-sm" id="btn-new-panel" style="width:auto;">${icon("plus")} Novo painel</button>
        </div>
        <table>
          <thead><tr><th>Nome</th><th>URL de incorporação</th><th></th></tr></thead>
          <tbody id="panels-tbody"></tbody>
        </table>
      </div>
    `;
    const tbody = document.getElementById("panels-tbody");
    tbody.innerHTML = panelsCache.map(p => `
      <tr>
        <td style="display:flex;align-items:center;gap:9px;">
          <span style="color:var(--green-mid);">${icon(p.icon||"grid")}</span>
          <strong>${escapeHtml(p.name)}</strong>
        </td>
        <td style="color:var(--text-secondary);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
          ${p.embed_url ? escapeHtml(p.embed_url) : '<em>não configurada</em>'}
        </td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" data-edit="${p.id}" title="Editar">${icon("edit")}</button>
            <button class="icon-btn danger" data-delete="${p.id}" title="Excluir">${icon("trash")}</button>
          </div>
        </td>
      </tr>
    `).join("");

    document.getElementById("btn-new-panel").addEventListener("click", () => openPanelModal(null));
    tbody.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openPanelModal(b.dataset.edit)));
    tbody.querySelectorAll("[data-delete]").forEach(b => b.addEventListener("click", () => deletePanel(b.dataset.delete)));
  }

  function openPanelModal(panelId){
    const editing = !!panelId;
    const panel = editing ? panelsCache.find(p => p.id === panelId) : null;
    const iconOptions = Object.keys(ICONS).filter(k => !['edit','trash','plus','external'].includes(k))
      .map(k => `<option value="${k}" ${panel && panel.icon===k ? "selected":""}>${k}</option>`).join("");

    openModal(`
      <h3>${editing ? "Editar painel" : "Novo painel"}</h3>
      <p class="modal-sub">Cole a URL "Publicar na web" ou de embed do relatório do Power BI.</p>
      <div class="form-error" id="panel-form-error"></div>
      <form id="panel-form">
        <div class="field-light">
          <label>Nome do painel</label>
          <input type="text" id="pf-name" value="${editing ? escapeAttr(panel.name) : ''}" placeholder="ex: Ferro Gusa" required>
        </div>
        <div class="field-light">
          <label>Ícone</label>
          <select id="pf-icon">${iconOptions}</select>
        </div>
        <div class="field-light">
          <label>URL de incorporação (embed)</label>
          <input type="text" id="pf-url" value="${editing ? escapeAttr(panel.embed_url||'') : ''}" placeholder="https://app.powerbi.com/reportEmbed?...">
        </div>
        <div class="field-light">
          <label>Descrição / comentário do painel</label>
          <input type="text" id="pf-description" value="${editing ? escapeAttr(panel.description||'') : ''}" placeholder="ex: Indicadores de produção e expedição do trimestre" maxlength="140">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="pf-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">${editing ? "Salvar" : "Cadastrar"}</button>
        </div>
      </form>
    `);

    document.getElementById("pf-cancel").addEventListener("click", closeModal);
    document.getElementById("panel-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("pf-name").value.trim();
      const iconName = document.getElementById("pf-icon").value;
      const embedUrl = document.getElementById("pf-url").value.trim();
      const description = document.getElementById("pf-description").value.trim();
      const errEl = document.getElementById("panel-form-error");
      if (!name) return showFormError(errEl, "Informe um nome para o painel.");

      const submitBtn = e.target.querySelector("button[type=submit]");
      submitBtn.disabled = true;

      let error;
      if (editing) {
        ({ error } = await sb.from("panels").update({
          name, icon: iconName, embed_url: embedUrl, description
        }).eq("id", panelId));
      } else {
        ({ error } = await sb.from("panels").insert({
          name, icon: iconName, embed_url: embedUrl, description
        }));
      }
      submitBtn.disabled = false;
      if (error) return showFormError(errEl, error.message);

      const { data: panels } = await sb.from("panels").select("*").order("created_at", { ascending: true });
      panelsCache = panels || [];
      closeModal();
      renderAdminPanels();
      renderSidebarPanels();
      toast(editing ? "Painel atualizado." : "Painel cadastrado.");
    });
  }

  async function deletePanel(panelId){
    const panel = panelsCache.find(p => p.id === panelId);
    if (!panel) return;
    if (!confirm(`Excluir o painel "${panel.name}"? Ele será removido do acesso de todos os usuários.`)) return;

    const { error } = await sb.from("panels").delete().eq("id", panelId);
    if (error) { toast("Erro ao excluir: " + error.message); return; }

    const { data: panels } = await sb.from("panels").select("*").order("created_at", { ascending: true });
    panelsCache = panels || [];
    renderAdminPanels();
    renderSidebarPanels();
    if (activeView === "panel:" + panelId) setActiveView("admin-panels");
    toast("Painel excluído.");
  }

  /* ============================================================
     MODAL HELPERS
     ============================================================ */
  function openModal(html){
    document.getElementById("modal-body").innerHTML = html;
    document.getElementById("modal-overlay").classList.add("active");
  }
  function closeModal(){
    document.getElementById("modal-overlay").classList.remove("active");
    document.getElementById("modal-body").innerHTML = "";
  }
  document.getElementById("modal-overlay").addEventListener("click", (e) => {
    if (e.target.id === "modal-overlay") closeModal();
  });
  function showFormError(el, msg){ el.textContent = msg; el.style.display = "block"; }

  /* ============================================================
     UTILS
     ============================================================ */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  document.getElementById("menu-toggle").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
  });

  /* ============================================================
     INIT
     ============================================================ */
  (async function init(){
    if (CONFIG_MISSING) { showConfigMissing(); return; }

    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      await loadProfileAndEnter();
    }

    sb.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT") {
        location.reload();
      }
    });
  })();

})();
</script>
</body>
</html>
